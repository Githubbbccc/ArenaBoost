# Gradle version used by AiCaption (the minimum AGP 8.7.3 supports). No gradle-wrapper.jar
# is committed (the sandbox that produced Phase 3 had no network to fetch it) - run
# `gradle wrapper` once to generate ./gradlew + gradle/wrapper/gradle-wrapper.jar, or build
# with a local Gradle 8.9.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
