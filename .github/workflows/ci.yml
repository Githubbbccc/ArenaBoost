name: Test & Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows app – tests on real Windows + EXE
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install psutil pytest pyinstaller
      - run: python -m pytest -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name ArenaBoost arenaboost.py
      - uses: actions/upload-artifact@v4
        with: { name: ArenaBoost-Windows, path: windows/dist/ArenaBoost.exe }

  android:
    name: Mobile app – tests + APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: ArenaBoost-Android, path: mobile/build/app/outputs/flutter-apk/app-release.apk }

  ios:
    name: iOS – compile check (no signing)
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
